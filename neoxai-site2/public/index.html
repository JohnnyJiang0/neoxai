<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NeoXAI Math</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<meta name="description" content="NeoXAI Math: a math tutor that explains, draws graphs, makes quizzes and reads photos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#000;--fg:#fff;--dim:color-mix(in srgb,var(--fg) 55%,transparent);--line:color-mix(in srgb,var(--fg) 22%,transparent);--glass:color-mix(in srgb,var(--bg) 62%,transparent);--bubble:color-mix(in srgb,var(--fg) 7%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:860px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:7px;font-weight:300}
h1 b{font-weight:800}
.sp{flex:1}
button,input,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--glass);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(8px)}
.btn:hover,.btn.on{border-color:var(--fg)}
main{flex:1;overflow-y:auto;padding:10px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.hero{margin:auto;text-align:center}
.hero h2{font-size:clamp(34px,8vw,64px);font-weight:200;letter-spacing:12px;margin:0 0 10px;text-shadow:0 0 30px var(--dim)}
.hero h2 b{font-weight:800}
.hero p{color:var(--dim);letter-spacing:3px;font-size:12px;text-transform:uppercase;margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--glass);border:1px solid var(--line);padding:9px 14px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--fg)}
.msg{max-width:88%;padding:12px 16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;backdrop-filter:blur(10px)}
.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.msg.err{border-color:#f55;color:#f77}
footer{padding:10px 20px 18px}
.bar{display:flex;gap:8px;align-items:flex-end;background:var(--glass);border:1px solid var(--line);padding:8px;backdrop-filter:blur(12px)}
.bar:focus-within{border-color:var(--fg);box-shadow:0 0 24px var(--line)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;padding:8px;max-height:140px}
.send{background:var(--fg);color:var(--bg);border:0;width:42px;height:42px;cursor:pointer;font-size:18px}
.send:disabled{opacity:.4}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 14px;letter-spacing:4px;font-weight:300;text-transform:uppercase}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
dialog input{width:100%;background:var(--bubble);border:1px solid var(--line);padding:9px}
dialog input[type=color]{height:42px;padding:3px;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;justify-content:flex-end;margin-top:18px}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
.draw{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;margin:10px 0;max-width:100%;overflow:auto}
:root[data-dark="1"] .draw img{filter:invert(1) hue-rotate(180deg)}
.gw{position:relative}
.gw canvas{touch-action:none;cursor:grab;border-radius:4px}
.gt{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.gt button{width:30px;height:30px;border:1px solid var(--line);background:var(--glass);color:var(--fg);cursor:pointer;font-size:16px;line-height:1;border-radius:6px}
.gt button:hover{border-color:var(--fg)}
.gh{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.draw canvas,.draw img{display:block;width:100%;max-width:560px;margin:0 auto;height:auto}
.txt{white-space:pre-wrap}
.pend{opacity:.6;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:8px 0}
.msg.bot{white-space:normal}
.row{gap:8px}
.h{font-weight:800;letter-spacing:1.5px;margin:14px 0 6px}
.h1{font-size:20px}.h2{font-size:15px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}.h3{font-size:14px}
.p{margin:4px 0}.li{display:flex;gap:8px;margin:3px 0}.bu{opacity:.7;min-width:18px}
.msg b{font-weight:800}
code{background:var(--bubble);padding:1px 5px}
table.t{border-collapse:collapse;margin:8px 0;font-size:14px}.t th,.t td{border:1px solid var(--line);padding:5px 10px}.t th{background:var(--bubble)}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--glass);padding:10px 12px;margin:10px 0;flex-wrap:wrap}
.fcard span{flex:1;min-width:140px;word-break:break-all}
.quiz{border:1px solid var(--line);background:var(--glass);padding:12px;margin:10px 0}
.qq{margin:12px 0}.qt{font-weight:700;margin-bottom:8px}
.qo{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;background:var(--bubble);border:1px solid var(--line);cursor:pointer;font-size:14px}
.qo:hover:not(:disabled){border-color:var(--fg)}
.qo:disabled{cursor:default;color:var(--fg);opacity:1}
.qo.ok{background:rgba(34,197,94,.28);border-color:#22c55e}
.qo.bad{background:rgba(239,68,68,.28);border-color:#ef4444}
.qe{display:none;font-size:13px;margin-top:6px;color:var(--dim)}.qe.show{display:block}
.qs{display:none;font-weight:800;letter-spacing:1px;margin-top:10px}
.qs.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ci{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;margin:6px 0}
.ci .tt{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .tt small{display:block;color:var(--dim)}
.att{background:none;border:1px solid var(--line);width:42px;height:42px;cursor:pointer;font-size:18px}
.att:hover{border-color:var(--fg)}
#prev{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pv{position:relative}.pv img{height:64px;border:1px solid var(--line);display:block}
.pv button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px;line-height:1;padding:0}
.msg img.up{max-height:120px;max-width:100%;margin:0 6px 6px 0;border:1px solid var(--line);display:inline-block;vertical-align:top}
.xl{border:1px solid var(--line);margin:10px 0;background:var(--bg)}
.xlb{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.xlb span{flex:1;font-weight:700}
.xlw{overflow:auto;max-height:420px}
table.xt{border-collapse:collapse;font-size:13px;min-width:100%}
.xt th,.xt td{border:1px solid var(--line);padding:4px 10px;white-space:nowrap}
.xt th{background:var(--bubble);color:var(--dim);font-weight:600;text-align:center;position:sticky;top:0}
.xt th.rn{position:sticky;left:0;min-width:34px}
.xt td.n{text-align:right;font-variant-numeric:tabular-nums}
.xt td.hd{font-weight:800;background:color-mix(in srgb,#22c55e 18%,transparent)}
.xlt{display:flex;border-top:1px solid var(--line)}
.xlt button{background:none;border:0;border-right:1px solid var(--line);padding:6px 14px;font-size:12px;cursor:pointer}
.xlt button.on{background:var(--bubble);font-weight:700}
.mathd{margin:8px 0;overflow-x:auto;overflow-y:hidden}
.mwrap{position:relative;align-self:flex-end}
.mbtn{height:42px;padding:0 14px;display:flex;align-items:center;gap:8px;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:13px;background:none}
.mbtn .car{font-size:11px;color:var(--dim);transition:transform .2s}
.mbtn[aria-expanded=true] .car{transform:rotate(180deg)}
.mmenu{position:absolute;right:0;bottom:calc(100% + 16px);width:min(300px,78vw);display:none;flex-direction:column;gap:4px;padding:8px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:5}
.mmenu.open{display:flex}
.mopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer;font-size:14px}
.mopt:hover,.mopt.on{background:var(--bubble)}
.mopt b{display:block;font-weight:600;font-size:14px}
.mopt span{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.mopt .ic{margin-left:auto;font-size:15px}
.mopt.lock{opacity:.45;cursor:not-allowed}
.mopt.lock:hover{background:none}
@media(max-width:520px){.bar{flex-wrap:wrap}.bar textarea{flex:1 1 100%;order:-1}.mwrap{margin-left:auto}}
/* smooth corners */
.btn{border-radius:12px}
.chip,.mbtn{border-radius:999px}

.msg.user{border-bottom-right-radius:6px}
.msg.bot{border-bottom-left-radius:6px}
.bar{border-radius:28px}
.send,.att{border-radius:50%}
.mmenu{border-radius:20px}
.mopt{border-radius:14px}
dialog{border-radius:22px}

.draw{border-radius:14px}
.gw canvas{border-radius:8px}

.pv img,.msg img.up{border-radius:10px}

.btn{transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;will-change:transform}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px var(--line)}
.mbtn{will-change:auto;transform:none!important}

.stp,.fl{border:1px solid var(--line);background:var(--glass);padding:12px;margin:10px 0;border-radius:16px}
.stp .si{display:none;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px;border-left:2px solid var(--line)}
.stp .si.show{display:flex;animation:stin .35s both}.stp .si.res{border-left-color:#22c55e;background:rgba(34,197,94,.14);font-weight:700}
@keyframes stin{from{opacity:0;transform:translateY(8px)}}
.stp .sn{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--fg);display:grid;place-items:center;font-size:12px}
.stp .stx{min-width:0;overflow-x:auto}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.row2 .cnt{flex:1;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.btn:disabled{opacity:.4;cursor:default}
.fl .fcd{min-height:130px;display:grid;place-items:center;text-align:center;padding:18px;border:1px solid var(--line);background:var(--bubble);border-radius:14px;cursor:pointer;font-size:18px;user-select:none;transition:border-color .2s}
.fl .fcd:hover,.fl .fcd:focus-visible{border-color:var(--dim);outline:0}.fl .fcd.back{border-color:var(--fg);background:var(--glass)}
body{transition:background .4s,color .4s,padding-left .25s}
#nxside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:4;display:flex;flex-direction:column;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(14px);transform:translateX(-100%);transition:transform .25s}

.nbl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

.nbq{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}

dialog.nxd::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.nxd h3{margin:0 0 10px;font-weight:300;letter-spacing:3px;text-transform:uppercase;font-size:14px}
.nxd input.nxi2{width:100%;background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;outline:0}
.nxd input.nxi2:focus{border-color:var(--fg)}
#pl{max-height:50vh;overflow-y:auto;margin-top:8px}
.pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}.pi.on,.pi:hover{background:var(--bubble)}.pi small{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.ctabs{display:flex;gap:6px;margin-bottom:10px}.ctabs .btn.on{border-color:var(--fg)}
#cdisp{font-size:28px;text-align:right;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bubble);overflow-x:auto;white-space:nowrap}
#chist{font-size:12px;color:var(--dim);text-align:right;min-height:18px;margin:4px 6px}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.kp button{padding:11px 0;border:1px solid var(--line);border-radius:12px;background:var(--bubble);color:var(--fg);font:inherit;cursor:pointer}.kp button:hover{border-color:var(--fg)}.kp .op{background:var(--glass)}.kp .eq{background:var(--fg);color:var(--bg)}
#fl{max-height:46vh;overflow-y:auto;margin-top:8px;display:grid;gap:6px}
.fi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bubble)}.fi:hover{border-color:var(--fg)}.fi b{font-size:13px}.fi small{display:block;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
#sympop{position:absolute;bottom:calc(100% + 8px);left:230px;display:none;flex-wrap:wrap;gap:4px;max-width:300px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);z-index:6}#sympop.open{display:flex}
#sympop button{min-width:34px;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bubble);color:var(--fg);cursor:pointer;font:inherit}#sympop button:hover{border-color:var(--fg)}
.bar{position:relative}.att2.on{border-color:#ef4444;box-shadow:0 0 18px rgba(239,68,68,.6)}
body.nxfocus header,body.nxfocus .note,body.nxfocus #nxside{display:none!important}body.nxfocus{padding-left:0!important}

/* ---- fewer buttons, + menu, file cards ---- */
header #themes,header #nbbtn,header #glbtn,header #exp,header #nxc,header #nxst,header #nxk,header a.btn{display:none!important}
#nxmenu,#plusmenu{display:none;position:absolute;z-index:9;min-width:210px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 14px 50px rgba(0,0,0,.5)}
#nxmenu{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:14px}#plusmenu{bottom:calc(100% + 8px);left:0}
#nxmenu.open,#plusmenu.open{display:block}
.pmi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}.pmi:hover{background:var(--bubble)}.pmi span:first-child{width:20px;text-align:center}
.fcard.fcx{display:block}.fch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.fch .ic{font-size:26px}.fch .nm{font-weight:700;word-break:break-all}.fch small{display:block;color:var(--dim);font-size:12px}.fch .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.fcv{margin-top:10px}
.mbtn.on{border-color:var(--fg);box-shadow:0 0 22px var(--fg)}

/* ---- button animations: hover pop, press squish (plus the magnet below) ---- */
.btn,.send,.att,.chip,.pmi{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background .2s}
.btn:not(.mbtn):hover,.send:hover,.att:hover,.chip:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 26px var(--line)}
.btn:not(.mbtn):active,.send:active,.att:active,.chip:active{transform:scale(.93)!important;box-shadow:none}
@media(prefers-reduced-motion:reduce){.btn,.send,.att,.chip{transition:none}.btn:hover,.send:hover,.att:hover,.chip:hover{transform:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header>
    <button class="btn" id="chats" title="Show or hide chats">☰</button>
    <h1><b>NEO</b>X<b>AI</b></h1>
    <div class="sp"></div>
    <a class="btn" href="https://home.neoxai.website" style="text-decoration:none;color:inherit">Home</a>
    <a class="btn" href="https://pricing.neoxai.website" style="text-decoration:none;color:inherit">Pricing</a>
    <button class="btn" id="themes">Themes</button>
    <button class="btn still" id="nbbtn" title="Question notebook">📒</button>
    <button class="btn still" id="glbtn" title="Graph Lab">📈</button>
    <button class="btn" id="exp">Export</button>
    <button class="btn" id="clear">New</button>
  </header>
  <main id="chat">
    <div class="hero" id="hero">
      <h2><b>NEO</b>X<b>AI</b></h2>
      <p>Your math tutor. Explains, draws and reads photos.</p>
      <div class="chips">
        <button class="chip">Show me how y = x^2 - 4 looks</button>
        <button class="chip">Explain the Pythagorean theorem with a drawing</button>
        <button class="chip">Give me a 5-question fractions quiz</button>
        <button class="chip">Make an Excel sheet to practice multiplication</button>
        <button class="chip">/solve x^2 - 5x + 6 = 0</button>
        <button class="chip">Write a Python program that checks if a number is prime</button>
        <button class="chip">Show me a 3D cylinder and its volume</button>
      </div>
    </div>
  </main>
  <footer>
    <div id="nxcmd" role="listbox"></div>
    <button class="btn still" id="nxstop" hidden>■ Stop</button>
    <div id="prev"></div>
    <div class="bar">
      <button class="att" id="attach" hidden title="Add a photo of a problem">📷</button><input type="file" id="pick" accept="image/*" multiple hidden>
      <textarea id="in" rows="1" placeholder="Ask a math question… or type /help"></textarea>
      <div class="mwrap">
        <div class="mmenu" id="mmenu" role="menu"></div>
        <button class="btn mbtn" id="models" aria-haspopup="menu" aria-expanded="false"><span id="mname">NeoStandard 1.0</span><span class="car">▾</span></button>
      </div>
      <button class="send" id="send">➤</button>
    </div>
    <div class="note" id="note">Johnny made this AI just for fun.</div>
  </footer>
</div>

<aside id="nxside">
  <button class="btn still" id="snew">＋ New chat</button>
  <input id="nxq" placeholder="Search chats…" autocomplete="off">
  <div id="nxl"></div>
</aside>
<div id="nxbk"></div>
<div id="nxlab" role="dialog" aria-modal="true"><div class="lab">
  <div class="labh"><button class="tab on" data-t="nb">📒 Notebook</button><button class="tab" data-t="gl">📈 Graph Lab</button><span></span><button id="labx" aria-label="Close">✕</button></div>
  <div id="nbv" class="labb">
    <div class="nbt"><input id="nbq" placeholder="Search every question you have asked…" autocomplete="off"><button class="lb" id="nbx">Export</button></div>
    <div id="nbn" class="nbn"></div><div id="nbc" class="nbc"></div><div id="nbl" class="nbl"></div>
  </div>
  <div id="glv" class="labb" hidden><div class="glw">
    <div class="glp"><div id="glf"></div><button class="lb" id="gla">+ Add function</button><div class="glpre" id="glpre"></div><div id="glk"></div><div id="glr" class="glr"></div><button class="lb" id="glai">Ask AI about this graph</button><div class="glh">Drag to move, scroll to zoom, double-click to reset.</div></div>
    <div class="glc"><canvas id="labcv"></canvas></div>
  </div></div>
</div></div>

<dialog id="tdlg">
  <h3>Themes</h3>
  <div class="themes" id="tgrid">
    <button class="btn" data-t="neo">⚡ Neo</button>
    <button class="btn" data-t="light">◻ Neo Light</button>
    <button class="btn" data-t="space">🌌 Space</button>
    <button class="btn" data-t="kawaii">🌸 Kawaii</button>
    <button class="btn" data-t="nothing">○ Nothing</button>
    <button class="btn" data-t="emoji">😎 Emoji</button>
    <button class="btn" data-t="color">🎨 Color</button>
  </div>
  <label>Your emojis (Emoji theme)</label>
  <input id="emo" placeholder="🔥🐱🚀">
  <label>Your color (Color and Emoji themes)</label>
  <input id="col" type="color">
  <div class="row"><button class="btn" id="tclose">Done</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('in'),sendBtn=$('send'),tdlg=$('tdlg'),note=$('note');
let th={theme:'neo',emoji:'🔥🐱🚀',color:'#1a1a2e'};
try{th={...th,...JSON.parse(localStorage.getItem('neoxai-theme')||'{}')};}catch(e){}
let history=[],busy=false,sample=null;

/* ---------- models ---------- */
const MODELS=[
  {id:'standard',name:'NeoStandard 1.0',d:'Fast answers, graphs, quizzes and photo problems.'},
  {id:'flash',name:'NeoLight 1.5',d:'Everything: code files, Graph Lab, notebook, memory, 3D and step-by-step.'},
  {id:'asteroids',name:'NeoAsteroids 2.0',d:'Unavailable right now. Great for programming and design: writes code, builds layouts and explains it step by step.',lock:true},
  {id:'galaxy',name:'NeoGalaxy 2.0',d:'Unavailable right now. The deep thinker: it questions assumptions, explores the big ideas behind a problem and reasons slowly before it answers.',lock:true}];
let mid='standard'; try{ mid=localStorage.getItem('neoxai-model')||mid; }catch(e){}
if(!MODELS.some(m=>m.id===mid&&!m.lock)) mid='standard';
const curModel=()=>MODELS.find(m=>m.id===mid), mbtn=$('models'), menu=$('mmenu');
function renderModels(){
  $('mname').textContent=curModel().name; menu.textContent='';
  for(const m of MODELS){
    const b=document.createElement('button'); b.className='mopt'+(m.lock?' lock':'')+(m.id===mid?' on':'');
    b.dataset.m=m.id; b.setAttribute('role','menuitem'); if(m.lock) b.setAttribute('aria-disabled','true');
    const info=document.createElement('div'), n=document.createElement('b'), s=document.createElement('span'), ic=document.createElement('div');
    n.textContent=m.name; s.textContent=m.d; info.append(n,s);
    ic.className='ic'; ic.textContent=m.lock?'🔒':(m.id===mid?'✓':'');
    b.append(info,ic); menu.appendChild(b);
  }
}
function toggleMenu(open){ menu.classList.toggle('open',open); mbtn.setAttribute('aria-expanded',open); }
mbtn.onclick=e=>{ e.stopPropagation(); toggleMenu(!menu.classList.contains('open')); };
menu.onclick=e=>{ e.stopPropagation(); const b=e.target.closest('[data-m]'); if(!b) return;
  const m=MODELS.find(x=>x.id===b.dataset.m); if(!m||m.lock) return;
  mid=m.id; try{localStorage.setItem('neoxai-model',mid);}catch(e){} renderModels(); toggleMenu(false); inp.focus(); };
document.addEventListener('click',()=>toggleMenu(false));
addEventListener('keydown',e=>{ if(e.key==='Escape') toggleMenu(false); });
renderModels();

/* ---------- brain ---------- */
let dl=null,imgCaps=null,deepNext=false,ctl=null; sample=true;
fetch('/api/chat').then(r=>r.json()).then(i=>{ if(i&&i.vision){ imgCaps={maxCount:3,maxInputBytes:20e6}; $('pick').accept='image/*'; $('attach').hidden=false; } }).catch(()=>{});
async function ask(msgs,onText){
  const res=await fetch('/api/chat',{method:'POST',signal:ctl&&ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:mid,memory:memText(),deep:(()=>{ const d=deepNext; deepNext=false; return d; })()})});
  if(!res.ok){ let m=''; try{ m=(await res.json()).error||''; }catch(e){} const er=new Error(m||('Server '+res.status)); er.status=res.status; throw er; }
  const rd=res.body.getReader(),dec=new TextDecoder(); let buf='',out='';
  for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); const L=buf.split('\n'); buf=L.pop();
    for(let l of L){ l=l.trim(); if(!l.startsWith('data:')) continue; l=l.slice(5).trim(); if(l==='[DONE]') continue;
      try{ const j=JSON.parse(l); const d=j.response!==undefined?j.response:(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||''; if(d){ out+=d; onText(out); } }catch(e){} } }
  if(!out) throw new Error('empty'); return out; }
const shrink=f=>createImageBitmap(f).then(bm=>{ const k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.85); });

function add(role,text,imgs){ const h=$('hero'); if(h) h.remove();
  const d=document.createElement('div'); d.className='msg '+role;
  (imgs||[]).forEach(u=>{ const im=document.createElement('img'); im.className='up'; im.src=u; d.appendChild(im); });
  if(imgs&&imgs.length) d.appendChild(document.createElement('br'));
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
async function send(text){
  text=(text||inp.value).trim(); const ims=pend.slice(); if((!text&&!ims.length)||busy||!sample) return; if(!text) text='Please solve the problem in this photo.';
  const cm=ims.length?null:cmd(text); if(cm&&cm.done){ inp.value=''; return; } if(cm&&cm.prompt) text=cm.prompt;
  inp.value=''; inp.style.height='auto'; busy=true; sendBtn.disabled=true;
  const um={role:'user',content:text}; if(ims.length) um.imgs=ims.map(p=>p.thumb); history.push(um); add('user',text,um.imgs); pend=[]; drawPrev();
  const lr=cm&&cm.local!==undefined?cm.local:(ims.length?null:auto(text));
  if(lr){ const lb=add('bot',''); render(lb,lr); history.push({role:'assistant',content:lr}); persist(); addTools(lb,lr); chat.scrollTop=chat.scrollHeight; busy=false; sendBtn.disabled=!sample; inp.focus(); return; }
  const b=add('bot','.'); b.classList.add('think'); let dn=1; const dt=setInterval(()=>{ dn=dn%3+1; b.textContent='.'.repeat(dn); },380); const stopDots=()=>{ clearInterval(dt); b.classList.remove('think'); };
  const hh=history.slice(-30); while(hh.length&&hh[0].role!=='user') hh.shift();
  const urls=(await Promise.all(ims.map(p=>shrink(p.file).catch(()=>null)))).filter(Boolean);
  const msgs=hh.map(m=>{ let c=m.content; if(m.imgs&&m.imgs.length) c=(m===um?'The person attached '+m.imgs.length+' photo(s) of a question. Read the photo carefully, say what the problem is, then solve it step by step. ':'[Earlier the person sent a photo.] ')+c;
    if(m===um&&urls.length) return {role:m.role,content:[{type:'text',text:c},...urls.map(u=>({type:'image_url',image_url:{url:u}}))]}; return {role:m.role,content:c}; });
  let part=''; ctl=new AbortController(); $('nxstop').hidden=false;
  try{
    const raw=await ask(msgs,t=>{ part=t; stopDots(); render(b,noMem(t)); chat.scrollTop=chat.scrollHeight; }); const r={text:noMem(raw)}, fx=factsOf(raw); remember(fx);
    stopDots(); render(b,r.text); chat.scrollTop=chat.scrollHeight; history.push({role:'assistant',content:r.text}); addTools(b,r.text); if(fx.length){ const k=document.createElement('div'); k.className='nxk'; k.textContent='🧠 Remembered: '+fx.join(' · '); b.appendChild(k); }
    if(!chats.includes(cur)) chats.unshift(cur); cur.title=cur.title||history[0].content.slice(0,50); cur.ts=Date.now(); saveChats();
  }catch(e){
    stopDots(); if(e&&e.name==='AbortError'){ const pt=noMem(part).trim(); if(pt){ render(b,pt); history.push({role:'assistant',content:pt}); addTools(b,pt); persist(); } else { history.pop(); b.remove(); } busy=false; sendBtn.disabled=!sample; $('nxstop').hidden=true; ctl=null; inp.focus(); return; }
    history.pop(); b.classList.add('err');
    b.textContent=e&&e.status===429?'NeoXAI is busy right now (the free daily limit may be used up). Please try again later.':e&&e.message&&e.message!=='empty'?'Something went wrong: '+e.message:'Something went wrong. Please try again.';
  }
  $('nxstop').hidden=true; ctl=null;
  busy=false; sendBtn.disabled=!sample; inp.focus();
}
sendBtn.onclick=()=>send();
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));

/* ---------- code blocks ---------- */
const EXT={python:'py',py:'py',javascript:'js',js:'js',typescript:'ts',ts:'ts',html:'html',css:'css',java:'java',cpp:'cpp','c++':'cpp',c:'c',csharp:'cs',cs:'cs',php:'php',go:'go',rust:'rs',sql:'sql',json:'json',bash:'sh',sh:'sh',ruby:'rb',kotlin:'kt',swift:'swift'};
const KW=new Set('abstract and as assert async await break case catch class const continue def default del do elif else enum except export extends false final finally fn for from func function global if implements import in instanceof interface is lambda let match new nil none not null of or package pass private protected public raise return self static struct super switch this throw true try type typeof undefined use var void while with yield print println'.split(' '));
const RC=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!\-\-[\s\S]*?\-\->)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)\b/g;
const RH=/(#[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)\b/g;
function hl(code,lang){ const f=document.createDocumentFragment(); let last=0;
  for(const m of code.matchAll(/^(py|python|sh|bash|shell|ruby|rb|yaml|yml|r|toml)$/i.test(lang)?RH:RC)){
    const cls=m[1]?'com':m[2]?'str':m[3]?'num':KW.has(m[4].toLowerCase())?'kw':''; if(!cls) continue;
    if(m.index>last) f.append(code.slice(last,m.index)); const sp=document.createElement('span'); sp.className='t-'+cls; sp.textContent=m[0]; f.append(sp); last=m.index+m[0].length; }
  f.append(code.slice(last)); return f; }
function runCode(js,code,out){ const ifr=document.createElement('iframe'); ifr.setAttribute('sandbox','allow-scripts'); const id='r'+Math.random().toString(36).slice(2);
  if(!js){ ifr.className='cbp'; ifr.srcdoc=code; out.appendChild(ifr); return; }
  ifr.style.display='none'; let n=0; const pre=document.createElement('pre'); pre.className='cbt'; out.append(pre,ifr);
  const h=e=>{ if(!out.isConnected){ removeEventListener('message',h); return; } if(!e.data||e.data.id!==id) return; n++; pre.textContent+=(pre.textContent?'\n':'')+e.data.t; };
  addEventListener('message',h);
  const T='<'+'script>', E='<\/'+'script>';
  ifr.srcdoc=T+'const id='+JSON.stringify(id)+',L=(...a)=>parent.postMessage({id,t:a.map(x=>{try{return typeof x===\'object\'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(\' \')},\'*\');console.log=console.info=L;console.error=console.warn=(...a)=>L(\'Error:\',...a);onerror=m=>L(\'Error: \'+m);(async()=>{try{\n'+code.replace(/<\/script/gi,'<\\/script')+'\n}catch(e){L(\'Error: \'+e.message)}})()'+E;
  setTimeout(()=>{ if(!n&&out.isConnected) pre.textContent='(no output; use console.log to print results)'; },1500); }
function codeBox(lang,code){ lang=(lang||'').toLowerCase(); const box=document.createElement('div'); box.className='cb';
  const bar=document.createElement('div'); bar.className='cbh'; const nm=document.createElement('span'); nm.textContent=lang||'code'; bar.appendChild(nm);
  const mkb=(t,f)=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>f(b); bar.appendChild(b); };
  mkb('Copy',async b=>{ try{ await navigator.clipboard.writeText(code); b.textContent='Copied'; }catch(e){ b.textContent='Can’t copy'; } setTimeout(()=>{ b.textContent='Copy'; },1500); });
  mkb('Save',()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download='code.'+(EXT[lang]||'txt'); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
  const pre=document.createElement('pre'); pre.appendChild(hl(code,lang)); box.append(bar,pre);
  const js=/^(js|javascript|mjs)$/.test(lang);
  if(js||lang==='html'){ let out=null; mkb(js?'▶ Run':'▶ Preview',b=>{ if(out){ out.remove(); out=null; b.textContent=js?'▶ Run':'▶ Preview'; return; } out=document.createElement('div'); out.className='cbo'; box.appendChild(out); b.textContent='■ Close'; runCode(js,code,out); }); }
  return box; }
/* ---------- photos ---------- */
let pend=[];
const thumbOf=f=>createImageBitmap(f).then(bm=>{ const k=Math.min(1,200/Math.max(bm.width,bm.height)),c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bm.width*k)); c.height=Math.max(1,Math.round(bm.height*k)); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.7); }).catch(()=>null);
function drawPrev(){ const P=$('prev'); P.replaceChildren(); pend.forEach((p,i)=>{ const d=document.createElement('div'); d.className='pv'; const im=document.createElement('img'); im.src=p.thumb; const x=document.createElement('button'); x.textContent='×'; x.onclick=()=>{ pend.splice(i,1); drawPrev(); }; d.append(im,x); P.appendChild(d); }); }
async function addImgs(files){ for(const f of files){ if(!imgCaps) return;
  if(pend.length>=imgCaps.maxCount){ note.textContent='You can add up to '+imgCaps.maxCount+' photos.'; break; }
  if(f.size>imgCaps.maxInputBytes){ note.textContent='That photo is too large.'; continue; }
  const t=await thumbOf(f); if(!t){ note.textContent='I couldn’t read that image.'; continue; }
  pend.push({file:f,thumb:t}); } drawPrev(); }

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const [r,g,b]=hex2rgb(h);return (0.299*r+0.587*g+0.114*b)/255;};
function applyTheme(){
  const [bg,fg]=PRESET[th.theme]||[th.color,lum(th.color)>.55?'#000000':'#ffffff'];
  document.documentElement.style.setProperty('--bg',bg); document.documentElement.style.setProperty('--fg',fg);
  rgb=hex2rgb(fg); G.bg=bg; G.fg=fg; G.dark=lum(bg)<.5; document.documentElement.dataset.dark=G.dark?'1':''; document.querySelectorAll('canvas.gr').forEach(c=>c._r&&c._r()); initBg();
  document.querySelectorAll('#tgrid .btn').forEach(b=>b.classList.toggle('on',b.dataset.t===th.theme));

/* ---------- animated backgrounds ---------- */
const cv=$('bg'),g=cv.getContext('2d'); let W=0,H=0,pts=[],stars=[],fl=[],mx=-999,my=-999,t=0;
const ink=a=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
function glyphs(s){ try{ return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)].map(x=>x.segment).filter(x=>x.trim()); }catch(e){ return Array.from(s).filter(x=>x.trim()); } }
function initBg(){
  W=cv.width=innerWidth; H=cv.height=innerHeight; const T=th.theme;
  pts=Array.from({length:Math.min(110,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}));
  stars=Array.from({length:260},()=>({x:(Math.random()-.5)*W*2,y:(Math.random()-.5)*H*2,z:Math.random()*W}));
  const set=T==='kawaii'?['🌸','⭐','💖','☁️','🎀','🍓','✨','🦄']:glyphs(th.emoji);
  fl=Array.from({length:T==='kawaii'?38:30},()=>({e:set[Math.floor(Math.random()*set.length)]||'🙂',x:Math.random()*W,y:Math.random()*H,v:.3+Math.random()*.9,sz:18+Math.random()*34,ph:Math.random()*6.3,sw:.4+Math.random()*.8}));
}
addEventListener('resize',initBg);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
function neo(){
  const hz=H*.62; g.lineWidth=1; g.strokeStyle=ink(.10);
  for(let i=-20;i<=20;i++){ g.beginPath(); g.moveTo(W/2+i*18,hz); g.lineTo(W/2+i*W*.14,H); g.stroke(); }
  for(let i=0;i<14;i++){ const p=((i+t*3)%14)/14,y=hz+(H-hz)*p*p; g.strokeStyle=ink(.12*p+.02); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  const gr=g.createLinearGradient(0,hz-60,0,hz+20); gr.addColorStop(0,ink(0)); gr.addColorStop(1,ink(.10)); g.fillStyle=gr; g.fillRect(0,hz-60,W,80);
  for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; g.fillStyle=ink(.7); g.beginPath(); g.arc(p.x,p.y,1.6,0,6.3); g.fill(); }
  for(let i=0;i<pts.length;i++){ for(let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<130){ g.strokeStyle=ink(.22*(1-d/130)); g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
    const dm=Math.hypot(pts[i].x-mx,pts[i].y-my);
    if(dm<170){ g.strokeStyle=ink(.5*(1-dm/170)); g.beginPath(); g.moveTo(pts[i].x,pts[i].y); g.lineTo(mx,my); g.stroke(); } }
}
function space(){
  const n1=g.createRadialGradient(W*.25,H*.3,0,W*.25,H*.3,W*.5); n1.addColorStop(0,'rgba(110,60,220,.28)'); n1.addColorStop(1,'rgba(0,0,0,0)');
  const n2=g.createRadialGradient(W*.8,H*.75,0,W*.8,H*.75,W*.45); n2.addColorStop(0,'rgba(0,140,255,.22)'); n2.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=n1; g.fillRect(0,0,W,H); g.fillStyle=n2; g.fillRect(0,0,W,H);
  for(const s of stars){ s.z-=1.2; if(s.z<=1){ s.z=W; s.x=(Math.random()-.5)*W*2; s.y=(Math.random()-.5)*H*2; }
    const k=W/s.z,x=W/2+s.x*k*.5+(mx>0?(mx-W/2)*.02:0),y=H/2+s.y*k*.5,r=Math.max(.3,(1-s.z/W)*2.4);
    g.fillStyle=`rgba(255,255,255,${.4+.6*(1-s.z/W)})`; g.beginPath(); g.arc(x,y,r,0,6.3); g.fill(); }
  const sh=(t*40)%260; if(sh<40){ g.strokeStyle=`rgba(255,255,255,${1-sh/40})`; g.lineWidth=2; g.beginPath(); g.moveTo(W*.7-sh*9,H*.1+sh*4); g.lineTo(W*.7-sh*9+70,H*.1+sh*4-30); g.stroke(); }
}
function floaters(){
  g.textAlign='center'; g.textBaseline='middle';
  for(const f of fl){ f.y-=f.v; if(f.y<-60){ f.y=H+60; f.x=Math.random()*W; }
    const x=f.x+Math.sin(t*f.sw*3+f.ph)*28; g.save(); g.translate(x,f.y); g.rotate(Math.sin(t*2+f.ph)*.3);
    g.globalAlpha=.85; g.font=f.sz+'px serif'; g.fillText(f.e,0,0); g.restore(); }
}
applyTheme();
(function draw(){
  if(!(W>0&&H>0)){ requestAnimationFrame(draw); return; }
  t+=.012; g.clearRect(0,0,W,H); const T=th.theme;

/* magnetic buttons: buttons lean toward the pointer when it gets close */
(function(){
  if(matchMedia('(hover:none)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let raf=0,px=0,py=0;
  function tick(){raf=0;document.querySelectorAll('.btn:not(.mbtn):not(.still),.send,.att').forEach(b=>{
    const r=b.getBoundingClientRect();if(!r.width){b.style.transform='';return}
    const dx=px-(r.left+r.width/2),dy=py-(r.top+r.height/2),d=Math.hypot(dx,dy),R=Math.max(90,r.width*.9);
    b.style.transform=d<R?`translate(${(dx*.28).toFixed(1)}px,${(dy*.28).toFixed(1)}px)`:''})}
  addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
  document.addEventListener('pointerleave',()=>document.querySelectorAll('.btn:not(.mbtn):not(.still),.send,.att').forEach(b=>b.style.transform=''));
})();
