<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeoXAI Math</title>
<meta name="description" content="NeoXAI Math: a math tutor that explains, draws graphs, makes quizzes and reads photos.">
<link rel="icon" href="data:image/xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#000;--fg:#fff;--dim:color-mix(in srgb,var(--fg) 55%,transparent);--line:color-mix(in srgb,var(--fg) 22%,transparent);--glass:color-mix(in srgb,var(--bg) 62%,transparent);--bubble:color-mix(in srgb,var(--fg) 7%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:860px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:7px;font-weight:300}
h1 b{font-weight:800}
.sp{flex:1}
button,input,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--glass);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(8px)}
.btn:hover,.btn.on{border-color:var(--fg)}
main{flex:1;overflow-y:auto;padding:10px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.hero{margin:auto;text-align:center}
.hero h2{font-size:clamp(34px,8vw,64px);font-weight:200;letter-spacing:12px;margin:0 0 10px;text-shadow:0 0 30px var(--dim)}
.hero h2 b{font-weight:800}
.hero p{color:var(--dim);letter-spacing:3px;font-size:12px;text-transform:uppercase;margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--glass);border:1px solid var(--line);padding:9px 14px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--fg)}
.msg{max-width:88%;padding:12px 16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;backdrop-filter:blur(10px)}
.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.msg.err{border-color:#f55;color:#f77}
footer{padding:10px 20px 18px}
.bar{display:flex;gap:8px;align-items:flex-end;background:var(--glass);border:1px solid var(--line);padding:8px;backdrop-filter:blur(12px)}
.bar:focus-within{border-color:var(--fg);box-shadow:0 0 24px var(--line)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;padding:8px;max-height:140px}
.send{background:var(--fg);color:var(--bg);border:0;width:42px;height:42px;cursor:pointer;font-size:18px}
.send:disabled{opacity:.4}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 14px;letter-spacing:4px;font-weight:300;text-transform:uppercase}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
dialog input{width:100%;background:var(--bubble);border:1px solid var(--line);padding:9px}
dialog input[type=color]{height:42px;padding:3px;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;justify-content:flex-end;margin-top:18px}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
.draw{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;margin:10px 0;max-width:100%;overflow:auto}
:root[data-dark="1"] .draw img{filter:invert(1) hue-rotate(180deg)}
.gw{position:relative}
.gw canvas{touch-action:none;cursor:grab;border-radius:4px}
.gt{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.gt button{width:30px;height:30px;border:1px solid var(--line);background:var(--glass);color:var(--fg);cursor:pointer;font-size:16px;line-height:1;border-radius:6px}
.gt button:hover{border-color:var(--fg)}
.gh{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.draw canvas,.draw img{display:block;width:100%;max-width:560px;margin:0 auto;height:auto}
.txt{white-space:pre-wrap}
.pend{opacity:.6;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:8px 0}
.msg.bot{white-space:normal}
.row{gap:8px}
.h{font-weight:800;letter-spacing:1.5px;margin:14px 0 6px}
.h1{font-size:20px}.h2{font-size:15px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}.h3{font-size:14px}
.p{margin:4px 0}.li{display:flex;gap:8px;margin:3px 0}.bu{opacity:.7;min-width:18px}
.msg b{font-weight:800}
code{background:var(--bubble);padding:1px 5px}
table.t{border-collapse:collapse;margin:8px 0;font-size:14px}.t th,.t td{border:1px solid var(--line);padding:5px 10px}.t th{background:var(--bubble)}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--glass);padding:10px 12px;margin:10px 0;flex-wrap:wrap}
.fcard span{flex:1;min-width:140px;word-break:break-all}
.quiz{border:1px solid var(--line);background:var(--glass);padding:12px;margin:10px 0}
.qq{margin:12px 0}.qt{font-weight:700;margin-bottom:8px}
.qo{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;background:var(--bubble);border:1px solid var(--line);cursor:pointer;font-size:14px}
.qo:hover:not(:disabled){border-color:var(--fg)}
.qo:disabled{cursor:default;color:var(--fg);opacity:1}
.qo.ok{background:rgba(34,197,94,.28);border-color:#22c55e}
.qo.bad{background:rgba(239,68,68,.28);border-color:#ef4444}
.qe{display:none;font-size:13px;margin-top:6px;color:var(--dim)}.qe.show{display:block}
.qs{display:none;font-weight:800;letter-spacing:1px;margin-top:10px}
.qs.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ci{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;margin:6px 0}
.ci .tt{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .tt small{display:block;color:var(--dim)}
.att{background:none;border:1px solid var(--line);width:42px;height:42px;cursor:pointer;font-size:18px}
.att:hover{border-color:var(--fg)}
#prev{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pv{position:relative}.pv img{height:64px;border:1px solid var(--line);display:block}
.pv button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px;line-height:1;padding:0}
.msg img.up{max-height:120px;max-width:100%;margin:0 6px 6px 0;border:1px solid var(--line);display:inline-block;vertical-align:top}
.xl{border:1px solid var(--line);margin:10px 0;background:var(--bg)}
.xlb{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.xlb span{flex:1;font-weight:700}
.xlw{overflow:auto;max-height:420px}
table.xt{border-collapse:collapse;font-size:13px;min-width:100%}
.xt th,.xt td{border:1px solid var(--line);padding:4px 10px;white-space:nowrap}
.xt th{background:var(--bubble);color:var(--dim);font-weight:600;text-align:center;position:sticky;top:0}
.xt th.rn{position:sticky;left:0;min-width:34px}
.xt td.n{text-align:right;font-variant-numeric:tabular-nums}
.xt td.hd{font-weight:800;background:color-mix(in srgb,#22c55e 18%,transparent)}
.xlt{display:flex;border-top:1px solid var(--line)}
.xlt button{background:none;border:0;border-right:1px solid var(--line);padding:6px 14px;font-size:12px;cursor:pointer}
.xlt button.on{background:var(--bubble);font-weight:700}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header>
    <h1><b>NEO</b>X<b>AI</b></h1>
    <div class="sp"></div>
    <button class="btn" id="chats">Chats</button>
    <button class="btn" id="themes">Themes</button>
    <button class="btn" id="clear">New</button>
  </header>
  <main id="chat">
    <div class="hero" id="hero">
      <h2><b>NEO</b>X<b>AI</b></h2>
      <p>Your math tutor. Explains, draws and reads photos.</p>
      <div class="chips">
        <button class="chip">Who is the Creator of NeoXAI</button>
        <button class="chip">What AI model am I using?</button>
        <button class="chip">Give me a 5-question fractions quiz</button>
        <button class="chip">Make an Excel sheet to practice multiplication</button>
      </div>
    </div>
  </main>
  <footer>
    <div id="prev"></div>
    <div class="bar">
      <button class="att" id="attach" hidden title="Add a photo of a problem">📷</button><input type="file" id="pick" accept="image/*" multiple hidden>
      <textarea id="in" rows="1" placeholder="Ask a math question…"></textarea>
      <button class="send" id="send">➤</button>
    </div>
    <div class="note" id="note">NeoXAI can make mistakes. Check important information.</div>
  </footer>
</div>

<dialog id="cdlg">
  <h3>Chats</h3>
  <div id="clist"></div>
  <div class="row"><button class="btn" id="cnew">New chat</button><button class="btn" id="cclose">Close</button></div>
</dialog>

<dialog id="tdlg">
  <h3>Themes</h3>
  <div class="themes" id="tgrid">
    <button class="btn" data-t="neo">Neo Dark</button>
    <button class="btn" data-t="light">Neo Light</button>
    <button class="btn" data-t="space">Space</button>
    <button class="btn" data-t="kawaii">Kawaii</button>
    <button class="btn" data-t="nothing">Nothing</button>
    <button class="btn" data-t="emoji">Emoji</button>
    <button class="btn" data-t="color">Color</button>
  </div>
  <label>Your emojis (Emoji theme)</label>
  <input id="emo" placeholder="🔥🐱🚀">
  <label>Your color (Color and Emoji themes)</label>
  <input id="col" type="color">
  <div class="row"><button class="btn" id="tclose">Done</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('in'),sendBtn=$('send'),tdlg=$('tdlg'),note=$('note');
let th={theme:'neo',emoji:'🔥🐱🚀',color:'#1a1a2e'};
try{th={...th,...JSON.parse(localStorage.getItem('neoxai-theme')||'{}')};}catch(e){}
let history=[],busy=false,sample=null;

/* ---------- brain ---------- */
let dl=null,imgCaps=null; sample=true;
fetch('/api/chat').then(r=>r.json()).then(i=>{ if(i&&i.vision){ imgCaps={maxCount:3,maxInputBytes:20e6}; $('pick').accept='image/*'; $('attach').hidden=false; } }).catch(()=>{});
async function ask(msgs,onText){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});
  if(!res.ok){ let m=''; try{ m=(await res.json()).error||''; }catch(e){} const er=new Error(m||('Server '+res.status)); er.status=res.status; throw er; }
  const rd=res.body.getReader(),dec=new TextDecoder(); let buf='',out='';
  for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); const L=buf.split('\n'); buf=L.pop();
    for(let l of L){ l=l.trim(); if(!l.startsWith('data:')) continue; l=l.slice(5).trim(); if(l==='[DONE]') continue;
      try{ const j=JSON.parse(l); const d=j.response!==undefined?j.response:(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||''; if(d){ out+=d; onText(out); } }catch(e){} } }
  if(!out) throw new Error('empty'); return out; }
const shrink=f=>createImageBitmap(f).then(bm=>{ const k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.85); });

function add(role,text,imgs){ const h=$('hero'); if(h) h.remove();
  const d=document.createElement('div'); d.className='msg '+role;
  (imgs||[]).forEach(u=>{ const im=document.createElement('img'); im.className='up'; im.src=u; d.appendChild(im); });
  if(imgs&&imgs.length) d.appendChild(document.createElement('br'));
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
async function send(text){
  text=(text||inp.value).trim(); const ims=pend.slice(); if((!text&&!ims.length)||busy||!sample) return; if(!text) text='Please solve the problem in this photo.';
  inp.value=''; inp.style.height='auto'; busy=true; sendBtn.disabled=true;
  const um={role:'user',content:text}; if(ims.length) um.imgs=ims.map(p=>p.thumb); history.push(um); add('user',text,um.imgs); pend=[]; drawPrev();
  const b=add('bot','…');
  const hh=history.slice(-30); while(hh.length&&hh[0].role!=='user') hh.shift();
  const urls=(await Promise.all(ims.map(p=>shrink(p.file).catch(()=>null)))).filter(Boolean);
  const msgs=hh.map(m=>{ let c=m.content; if(m.imgs&&m.imgs.length) c=(m===um?'The person attached '+m.imgs.length+' photo(s) of a question. Read the photo carefully, say what the problem is, then solve it step by step. ':'[Earlier the person sent a photo.] ')+c;
    if(m===um&&urls.length) return {role:m.role,content:[{type:'text',text:c},...urls.map(u=>({type:'image_url',image_url:{url:u}}))]}; return {role:m.role,content:c}; });
  try{
    const r={text:await ask(msgs,t=>{ render(b,t); chat.scrollTop=chat.scrollHeight; })};
    render(b,r.text); chat.scrollTop=chat.scrollHeight; history.push({role:'assistant',content:r.text});
    if(!chats.includes(cur)) chats.unshift(cur); cur.title=cur.title||history[0].content.slice(0,50); cur.ts=Date.now(); saveChats();
  }catch(e){
    history.pop(); b.classList.add('err');
    b.textContent=e&&e.status===429?'NeoXAI is busy right now (the free daily limit may be used up). Please try again later.':e&&e.message&&e.message!=='empty'?'Something went wrong: '+e.message:'Something went wrong. Please try again.';
  }
  busy=false; sendBtn.disabled=!sample; inp.focus();
}
sendBtn.onclick=()=>send();
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));
/* ---------- photos ---------- */
let pend=[];
const thumbOf=f=>createImageBitmap(f).then(bm=>{ const k=Math.min(1,200/Math.max(bm.width,bm.height)),c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bm.width*k)); c.height=Math.max(1,Math.round(bm.height*k)); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.7); }).catch(()=>null);
function drawPrev(){ const P=$('prev'); P.replaceChildren(); pend.forEach((p,i)=>{ const d=document.createElement('div'); d.className='pv'; const im=document.createElement('img'); im.src=p.thumb; const x=document.createElement('button'); x.textContent='×'; x.onclick=()=>{ pend.splice(i,1); drawPrev(); }; d.append(im,x); P.appendChild(d); }); }
async function addImgs(files){ for(const f of files){ if(!imgCaps) return;
  if(pend.length>=imgCaps.maxCount){ note.textContent='You can add up to '+imgCaps.maxCount+' photos.'; break; }
  if(f.size>imgCaps.maxInputBytes){ note.textContent='That photo is too large.'; continue; }
  const t=await thumbOf(f); if(!t){ note.textContent='I couldn’t read that image.'; continue; }
  pend.push({file:f,thumb:t}); } drawPrev(); }
$('attach').onclick=()=>$('pick').click();
$('pick').onchange=e=>{ addImgs([...e.target.files]); e.target.value=''; };
inp.addEventListener('paste',e=>{ const f=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(x=>x.type.startsWith('image/')); if(f.length&&imgCaps){ e.preventDefault(); addImgs(f); } });

/* ---------- saved chats ---------- */
let chats=[],cur=null; const heroNode=$('hero'),cdlg=$('cdlg');
try{ chats=JSON.parse(localStorage.getItem('neoxai-chats')||'[]'); }catch(e){}
const saveChats=()=>{ try{ localStorage.setItem('neoxai-chats',JSON.stringify(chats.slice(0,40))); }catch(e){} };
function newChat(){ if(busy) return; cur={id:Date.now(),title:'',ts:Date.now(),msgs:[]}; history=cur.msgs; chat.replaceChildren(heroNode); }
function openChat(c){ if(busy) return; cur=c; history=c.msgs; chat.replaceChildren(); c.msgs.forEach(m=>{ if(m.role==='user') add('user',m.content,m.imgs); else render(add('bot',''),m.content); }); chat.scrollTop=chat.scrollHeight; }
function listChats(){ const L=$('clist'); L.replaceChildren(); if(!chats.length){ L.textContent='No saved chats yet.'; return; }
  [...chats].sort((a,b)=>b.ts-a.ts).forEach(c=>{ const d=document.createElement('div'); d.className='ci';
    const t=document.createElement('div'); t.className='tt'; t.textContent=c.title||'New chat'; const sm=document.createElement('small'); sm.textContent=new Date(c.ts).toLocaleString(); t.appendChild(sm);
    t.onclick=()=>{ openChat(c); cdlg.close(); };
    const x=document.createElement('button'); x.className='btn'; x.textContent='Delete';
    x.onclick=()=>{ chats=chats.filter(k=>k!==c); if(cur===c) newChat(); saveChats(); listChats(); };
    d.append(t,x); L.appendChild(d); }); }
$('chats').onclick=()=>{ listChats(); cdlg.showModal(); };
$('cnew').onclick=()=>{ newChat(); cdlg.close(); };
$('cclose').onclick=()=>cdlg.close();
$('clear').onclick=()=>newChat();

/* ---------- drawing ---------- */
const PD=['#4da3ff','#ff5c8a','#3ddc97','#ffb84d','#b388ff'],PL=['#2563eb','#e11d48','#059669','#d97706','#7c3aed'],G={bg:'#000000',fg:'#ffffff',dark:true};
function mkFn(src){
  let s=src.replace(/^\s*(y|f\(x\))\s*=/i,'').replace(/\^/g,'**').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi');
  s=s.replace(/(?<![A-Za-z.])(asin|acos|atan|sin|cos|tan|sqrt|abs|log|exp|floor|ceil)(?![A-Za-z])/g,'Math.$1').replace(/(?<![A-Za-z.])ln(?![A-Za-z])/g,'Math.log').replace(/(?<![A-Za-z.])pi(?![A-Za-z])/gi,'Math.PI').replace(/(?<![A-Za-z.])e(?![A-Za-z])/g,'Math.E');
  s=s.replace(/(\d|\)|x)\s*(?=x|\(|Math)/g,'$1*').replace(/^\s*-/,'0-');
  if(s.replace(/Math\.(asin|acos|atan|sin|cos|tan|sqrt|abs|log|exp|floor|ceil|PI|E)\b|x|\d+\.?\d*|[-+*\/().,\s]/g,'')!=='') return null;
  try{ return new Function('x','return '+s); }catch(e){ return null; }
}
const nice=r=>{ r/=6; const p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p; };
function graph(body){
  const fns=[],labels=[],pts=[]; let x0=-10,x1=10,fy=null;
  for(const ln of body.split('\n').map(l=>l.trim()).filter(Boolean)){
    let m;
    if((m=ln.match(/^range\s*:\s*(-?[\d.]+)\s*[, ]\s*(-?[\d.]+)/i))){ x0=+m[1]; x1=+m[2]; }
    else if((m=ln.match(/^yrange\s*:\s*(-?[\d.]+)\s*[, ]\s*(-?[\d.]+)/i))){ fy=[+m[1],+m[2]]; }
    else if(/^points?\s*:/i.test(ln)){ for(const q of ln.matchAll(/\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/g)) pts.push([+q[1],+q[2]]); }
    else{ const f=mkFn(ln); if(f){ fns.push(f); labels.push('y = '+ln.replace(/^\s*(y|f\(x\))\s*=\s*/i,'')); } }
  }
  if(!(x1>x0)){ x0=-10; x1=10; }
  const ev=(f,x)=>{ try{ const y=f(x); return Number.isFinite(y)?y:NaN; }catch(e){ return NaN; } };
  const ys=[]; fns.forEach(f=>{ for(let i=0;i<=400;i++){ const y=ev(f,x0+(x1-x0)*i/400); if(!isNaN(y)) ys.push(y); } });
  pts.forEach(q=>ys.push(q[1])); ys.sort((a,b)=>a-b);
  let lo=-5,hi=5; if(ys.length){ lo=ys[Math.floor(ys.length*.02)]; hi=ys[Math.ceil(ys.length*.98)-1]; }
  if(fy){ lo=fy[0]; hi=fy[1]; }
  const pad=fy?0:((hi-lo)*.1||1), home={x0,x1,y0:lo-pad,y1:hi+pad}; let v={...home},mouse=null,q0=0;
  const wrap=document.createElement('div'); wrap.className='gw';
  const cv=document.createElement('canvas'); cv.className='gr'; cv.width=1120; cv.height=720; wrap.appendChild(cv);
  const c=cv.getContext('2d'),w=560,h=360;

const mk=m=>{ const b=m[3].replace(/^\n+|\s+$/g,''),nm=(m[2]||'').trim();
  if(m[1]==='graph') return drawBox(graph(m[3])); if(m[1]==='svg') return drawBox(svgImg(m[3])); if(m[1]==='quiz') return quiz(m[3]);
  if(m[1]==='sheet'||/\.(xlsx?|csv)$/i.test(nm)) return sheetBox(b,nm); return fileCard(nm||'file.txt',b); };
function render(el,text){
  const cache=el._c||(el._c=new Map()); el.replaceChildren();
  const re=/\[\[(graph|svg|quiz|file|sheet)(?::([^\]\n]*))?\]\]([\s\S]*?)\[\[\/\1\]\]/g; let last=0,m;
  while((m=re.exec(text))){
    md(el,text.slice(last,m.index)); last=re.lastIndex;
    let box=cache.get(m[0]);
    if(!box){ try{ box=mk(m); }
      catch(e){ box=document.createElement('div'); box.className='pend'; box.textContent='(could not build this part)'; }
      cache.set(m[0],box); }
    el.appendChild(box);
  }
  const rest=text.slice(last), pm=rest.match(/\[\[(graph|svg|quiz|file|sheet)/);
  if(pm){ md(el,rest.slice(0,pm.index)); const d=document.createElement('div'); d.className='pend'; d.textContent=pm[1]==='quiz'?'Building quiz…':(pm[1]==='file'||pm[1]==='sheet')?'Building spreadsheet…':'Drawing…'; el.appendChild(d); }
  else md(el,rest);
}

/* ---------- themes ---------- */
const PRESET={neo:['#000000','#ffffff'],light:['#ffffff','#000000'],space:['#04040f','#e8eeff'],kawaii:['#ffdcee','#7a2e5c'],nothing:['#f3f3f3','#111111']};
let rgb=[255,255,255];
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const [r,g,b]=hex2rgb(h);return (0.299*r+0.587*g+0.114*b)/255;};
function applyTheme(){
  const [bg,fg]=PRESET[th.theme]||[th.color,lum(th.color)>.55?'#000000':'#ffffff'];
  document.documentElement.style.setProperty('--bg',bg); document.documentElement.style.setProperty('--fg',fg);
  rgb=hex2rgb(fg); G.bg=bg; G.fg=fg; G.dark=lum(bg)<.5; document.documentElement.dataset.dark=G.dark?'1':''; document.querySelectorAll('canvas.gr').forEach(c=>c._r&&c._r()); initBg();
  document.querySelectorAll('#tgrid .btn').forEach(b=>b.classList.toggle('on',b.dataset.t===th.theme));
  try{localStorage.setItem('neoxai-theme',JSON.stringify(th));}catch(e){}
}
$('themes').onclick=()=>{ $('emo').value=th.emoji; $('col').value=th.color; tdlg.showModal(); };
$('tclose').onclick=()=>tdlg.close();
$('tgrid').onclick=e=>{ const t=e.target.closest('[data-t]'); if(t){ th.theme=t.dataset.t; applyTheme(); } };
$('emo').oninput=()=>{ th.emoji=$('emo').value||'🙂'; th.theme='emoji'; applyTheme(); };
$('col').oninput=()=>{ th.color=$('col').value; if(th.theme!=='emoji') th.theme='color'; applyTheme(); };

/* ---------- animated backgrounds ---------- */
const cv=$('bg'),g=cv.getContext('2d'); let W=0,H=0,pts=[],stars=[],fl=[],mx=-999,my=-999,t=0;
const ink=a=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
function glyphs(s){ try{ return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)].map(x=>x.segment).filter(x=>x.trim()); }catch(e){ return Array.from(s).filter(x=>x.trim()); } }
function initBg(){
  W=cv.width=innerWidth; H=cv.height=innerHeight; const T=th.theme;
  pts=Array.from({length:Math.min(110,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}));
  stars=Array.from({length:260},()=>({x:(Math.random()-.5)*W*2,y:(Math.random()-.5)*H*2,z:Math.random()*W}));
  const set=T==='kawaii'?['🌸','⭐','💖','☁️','🎀','🍓','✨','🦄']:glyphs(th.emoji);
  fl=Array.from({length:T==='kawaii'?38:30},()=>({e:set[Math.floor(Math.random()*set.length)]||'🙂',x:Math.random()*W,y:Math.random()*H,v:.3+Math.random()*.9,sz:18+Math.random()*34,ph:Math.random()*6.3,sw:.4+Math.random()*.8}));
}
addEventListener('resize',initBg);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
function neo(){
  const hz=H*.62; g.lineWidth=1; g.strokeStyle=ink(.10);
  for(let i=-20;i<=20;i++){ g.beginPath(); g.moveTo(W/2+i*18,hz); g.lineTo(W/2+i*W*.14,H); g.stroke(); }
  for(let i=0;i<14;i++){ const p=((i+t*3)%14)/14,y=hz+(H-hz)*p*p; g.strokeStyle=ink(.12*p+.02); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  const gr=g.createLinearGradient(0,hz-60,0,hz+20); gr.addColorStop(0,ink(0)); gr.addColorStop(1,ink(.10)); g.fillStyle=gr; g.fillRect(0,hz-60,W,80);
  for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; g.fillStyle=ink(.7); g.beginPath(); g.arc(p.x,p.y,1.6,0,6.3); g.fill(); }
  for(let i=0;i<pts.length;i++){ for(let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<130){ g.strokeStyle=ink(.22*(1-d/130)); g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
    const dm=Math.hypot(pts[i].x-mx,pts[i].y-my);
    if(dm<170){ g.strokeStyle=ink(.5*(1-dm/170)); g.beginPath(); g.moveTo(pts[i].x,pts[i].y); g.lineTo(mx,my); g.stroke(); } }
}
function space(){
  const n1=g.createRadialGradient(W*.25,H*.3,0,W*.25,H*.3,W*.5); n1.addColorStop(0,'rgba(110,60,220,.28)'); n1.addColorStop(1,'rgba(0,0,0,0)');
  const n2=g.createRadialGradient(W*.8,H*.75,0,W*.8,H*.75,W*.45); n2.addColorStop(0,'rgba(0,140,255,.22)'); n2.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=n1; g.fillRect(0,0,W,H); g.fillStyle=n2; g.fillRect(0,0,W,H);
  for(const s of stars){ s.z-=1.2; if(s.z<=1){ s.z=W; s.x=(Math.random()-.5)*W*2; s.y=(Math.random()-.5)*H*2; }
    const k=W/s.z,x=W/2+s.x*k*.5+(mx>0?(mx-W/2)*.02:0),y=H/2+s.y*k*.5,r=Math.max(.3,(1-s.z/W)*2.4);
    g.fillStyle=`rgba(255,255,255,${.4+.6*(1-s.z/W)})`; g.beginPath(); g.arc(x,y,r,0,6.3); g.fill(); }
  const sh=(t*40)%260; if(sh<40){ g.strokeStyle=`rgba(255,255,255,${1-sh/40})`; g.lineWidth=2; g.beginPath(); g.moveTo(W*.7-sh*9,H*.1+sh*4); g.lineTo(W*.7-sh*9+70,H*.1+sh*4-30); g.stroke(); }
}
function floaters(){
  g.textAlign='center'; g.textBaseline='middle';
  for(const f of fl){ f.y-=f.v; if(f.y<-60){ f.y=H+60; f.x=Math.random()*W; }
    const x=f.x+Math.sin(t*f.sw*3+f.ph)*28; g.save(); g.translate(x,f.y); g.rotate(Math.sin(t*2+f.ph)*.3);
    g.globalAlpha=.85; g.font=f.sz+'px serif'; g.fillText(f.e,0,0); g.restore(); }
}
applyTheme();
(function draw(){
  if(!(W>0&&H>0)){ requestAnimationFrame(draw); return; }
  t+=.012; g.clearRect(0,0,W,H); const T=th.theme;
  if(T==='neo'||T==='light') neo(); else if(T==='space') space(); else if(T==='kawaii'||T==='emoji') floaters();
  requestAnimationFrame(draw);
})();
chats.length?openChat([...chats].sort((a,b)=>b.ts-a.ts)[0]):newChat();
</script>
