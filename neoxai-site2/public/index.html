<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NeoXAI Math</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<meta name="description" content="NeoXAI Math: a math tutor that explains, draws graphs, makes quizzes and reads photos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#000;--fg:#fff;--dim:color-mix(in srgb,var(--fg) 55%,transparent);--line:color-mix(in srgb,var(--fg) 22%,transparent);--glass:color-mix(in srgb,var(--bg) 62%,transparent);--bubble:color-mix(in srgb,var(--fg) 7%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:860px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:7px;font-weight:300}
h1 b{font-weight:800}
.sp{flex:1}
button,input,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--glass);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(8px)}
.btn:hover,.btn.on{border-color:var(--fg)}
main{flex:1;overflow-y:auto;padding:10px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.hero{margin:auto;text-align:center}
.hero h2{font-size:clamp(34px,8vw,64px);font-weight:200;letter-spacing:12px;margin:0 0 10px;text-shadow:0 0 30px var(--dim)}
.hero h2 b{font-weight:800}
.hero p{color:var(--dim);letter-spacing:3px;font-size:12px;text-transform:uppercase;margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--glass);border:1px solid var(--line);padding:9px 14px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--fg)}
.msg{max-width:88%;padding:12px 16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;backdrop-filter:blur(10px)}
.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.msg.err{border-color:#f55;color:#f77}
footer{padding:10px 20px 18px}
.bar{display:flex;gap:8px;align-items:flex-end;background:var(--glass);border:1px solid var(--line);padding:8px;backdrop-filter:blur(12px)}
.bar:focus-within{border-color:var(--fg);box-shadow:0 0 24px var(--line)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;padding:8px;max-height:140px}
.send{background:var(--fg);color:var(--bg);border:0;width:42px;height:42px;cursor:pointer;font-size:18px}
.send:disabled{opacity:.4}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 14px;letter-spacing:4px;font-weight:300;text-transform:uppercase}
label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
dialog input{width:100%;background:var(--bubble);border:1px solid var(--line);padding:9px}
dialog input[type=color]{height:42px;padding:3px;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;justify-content:flex-end;margin-top:18px}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
.draw{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;margin:10px 0;max-width:100%;overflow:auto}
:root[data-dark="1"] .draw img{filter:invert(1) hue-rotate(180deg)}
.gw{position:relative}
.gw canvas{touch-action:none;cursor:grab;border-radius:4px}
.gt{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.gt button{width:30px;height:30px;border:1px solid var(--line);background:var(--glass);color:var(--fg);cursor:pointer;font-size:16px;line-height:1;border-radius:6px}
.gt button:hover{border-color:var(--fg)}
.gh{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.draw canvas,.draw img{display:block;width:100%;max-width:560px;margin:0 auto;height:auto}
.txt{white-space:pre-wrap}
.pend{opacity:.6;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:8px 0}
.msg.bot{white-space:normal}
.row{gap:8px}
.h{font-weight:800;letter-spacing:1.5px;margin:14px 0 6px}
.h1{font-size:20px}.h2{font-size:15px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}.h3{font-size:14px}
.p{margin:4px 0}.li{display:flex;gap:8px;margin:3px 0}.bu{opacity:.7;min-width:18px}
.msg b{font-weight:800}
code{background:var(--bubble);padding:1px 5px}
table.t{border-collapse:collapse;margin:8px 0;font-size:14px}.t th,.t td{border:1px solid var(--line);padding:5px 10px}.t th{background:var(--bubble)}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--glass);padding:10px 12px;margin:10px 0;flex-wrap:wrap}
.fcard span{flex:1;min-width:140px;word-break:break-all}
.quiz{border:1px solid var(--line);background:var(--glass);padding:12px;margin:10px 0}
.qq{margin:12px 0}.qt{font-weight:700;margin-bottom:8px}
.qo{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;background:var(--bubble);border:1px solid var(--line);cursor:pointer;font-size:14px}
.qo:hover:not(:disabled){border-color:var(--fg)}
.qo:disabled{cursor:default;color:var(--fg);opacity:1}
.qo.ok{background:rgba(34,197,94,.28);border-color:#22c55e}
.qo.bad{background:rgba(239,68,68,.28);border-color:#ef4444}
.qe{display:none;font-size:13px;margin-top:6px;color:var(--dim)}.qe.show{display:block}
.qs{display:none;font-weight:800;letter-spacing:1px;margin-top:10px}
.qs.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ci{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;margin:6px 0}
.ci .tt{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .tt small{display:block;color:var(--dim)}
.att{background:none;border:1px solid var(--line);width:42px;height:42px;cursor:pointer;font-size:18px}
.att:hover{border-color:var(--fg)}
#prev{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pv{position:relative}.pv img{height:64px;border:1px solid var(--line);display:block}
.pv button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px;line-height:1;padding:0}
.msg img.up{max-height:120px;max-width:100%;margin:0 6px 6px 0;border:1px solid var(--line);display:inline-block;vertical-align:top}
.xl{border:1px solid var(--line);margin:10px 0;background:var(--bg)}
.xlb{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.xlb span{flex:1;font-weight:700}
.xlw{overflow:auto;max-height:420px}
table.xt{border-collapse:collapse;font-size:13px;min-width:100%}
.xt th,.xt td{border:1px solid var(--line);padding:4px 10px;white-space:nowrap}
.xt th{background:var(--bubble);color:var(--dim);font-weight:600;text-align:center;position:sticky;top:0}
.xt th.rn{position:sticky;left:0;min-width:34px}
.xt td.n{text-align:right;font-variant-numeric:tabular-nums}
.xt td.hd{font-weight:800;background:color-mix(in srgb,#22c55e 18%,transparent)}
.xlt{display:flex;border-top:1px solid var(--line)}
.xlt button{background:none;border:0;border-right:1px solid var(--line);padding:6px 14px;font-size:12px;cursor:pointer}
.xlt button.on{background:var(--bubble);font-weight:700}
.mathd{margin:8px 0;overflow-x:auto;overflow-y:hidden}
.mwrap{position:relative;align-self:flex-end}
.mbtn{height:42px;padding:0 14px;display:flex;align-items:center;gap:8px;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:13px;background:none}
.mbtn .car{font-size:11px;color:var(--dim);transition:transform .2s}
.mbtn[aria-expanded=true] .car{transform:rotate(180deg)}
.mmenu{position:absolute;right:0;bottom:calc(100% + 16px);width:min(300px,78vw);display:none;flex-direction:column;gap:4px;padding:8px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:5}
.mmenu.open{display:flex}
.mopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer;font-size:14px}
.mopt:hover,.mopt.on{background:var(--bubble)}
.mopt b{display:block;font-weight:600;font-size:14px}
.mopt span{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.mopt .ic{margin-left:auto;font-size:15px}
.mopt.lock{opacity:.45;cursor:not-allowed}
.mopt.lock:hover{background:none}
@media(max-width:520px){.bar{flex-wrap:wrap}.bar textarea{flex:1 1 100%;order:-1}.mwrap{margin-left:auto}}
/* smooth corners */
.btn{border-radius:12px}
.chip,.mbtn{border-radius:999px}

.msg.user{border-bottom-right-radius:6px}
.msg.bot{border-bottom-left-radius:6px}
.bar{border-radius:28px}
.send,.att{border-radius:50%}
.mmenu{border-radius:20px}
.mopt{border-radius:14px}
dialog{border-radius:22px}

.draw{border-radius:14px}
.gw canvas{border-radius:8px}

.pv img,.msg img.up{border-radius:10px}

.btn{transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;will-change:transform}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px var(--line)}
.mbtn{will-change:auto;transform:none!important}

.stp,.fl{border:1px solid var(--line);background:var(--glass);padding:12px;margin:10px 0;border-radius:16px}
.stp .si{display:none;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px;border-left:2px solid var(--line)}
.stp .si.show{display:flex;animation:stin .35s both}.stp .si.res{border-left-color:#22c55e;background:rgba(34,197,94,.14);font-weight:700}
@keyframes stin{from{opacity:0;transform:translateY(8px)}}
.stp .sn{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--fg);display:grid;place-items:center;font-size:12px}
.stp .stx{min-width:0;overflow-x:auto}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.row2 .cnt{flex:1;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.btn:disabled{opacity:.4;cursor:default}
.fl .fcd{min-height:130px;display:grid;place-items:center;text-align:center;padding:18px;border:1px solid var(--line);background:var(--bubble);border-radius:14px;cursor:pointer;font-size:18px;user-select:none;transition:border-color .2s}
.fl .fcd:hover,.fl .fcd:focus-visible{border-color:var(--dim);outline:0}.fl .fcd.back{border-color:var(--fg);background:var(--glass)}
body{transition:background .4s,color .4s,padding-left .25s}
#nxside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:4;display:flex;flex-direction:column;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(14px);transform:translateX(-100%);transition:transform .25s}

.nbl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

.nbq{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('in'),sendBtn=$('send'),tdlg=$('tdlg'),note=$('note');
let th={theme:'neo',emoji:'🔥🐱🚀',color:'#1a1a2e'};
try{th={...th,...JSON.parse(localStorage.getItem('neoxai-theme')||'{}')};}catch(e){}
let history=[],busy=false,sample=null;

/* ---------- models ---------- */
const MODELS=[
  {id:'asteroid',name:'Neo-1.0 Asteroid',d:'The builder. Writes working code and always designs it beautifully: websites, apps, games and UI with a live project preview.',isNew:true,ph:'Describe what to build… or type /help'},
  {id:'galaxy',name:'Neo-1.0 Galaxy',d:'The thinker. Careful step-by-step reasoning for math, science and big questions, with graphs, quizzes, 3D and its own answer checks.',isNew:true,ph:'Ask a math question… or type /help'}];
let mid='asteroid'; try{ mid=localStorage.getItem('neoxai-model')||mid; }catch(e){}
if(!MODELS.some(m=>m.id===mid&&!m.lock)) mid='asteroid';   // older saved choices (NeoStandard, NeoLight) become Asteroid
const OLD=[{name:'NeoStandard 1.0',d:'Fast answers, graphs, quizzes and photo problems.'},{name:'NeoLight 1.5',d:'Everything: code files, Graph Lab, notebook, memory, 3D and step-by-step.'},{name:'Neo-2.7 Research Tester',d:'Research test build.',tag:'UNAVAILABLE',note:'Unavailable and outdated.'}];
let showOld=false;
const curModel=()=>MODELS.find(m=>m.id===mid), mbtn=$('models'), menu=$('mmenu');
function renderModels(){
  $('mname').textContent=curModel().name; $('mnew').hidden=!curModel().isNew; inp.placeholder=curModel().ph||inp.placeholder; menu.textContent='';
  for(const m of MODELS){
    const b=document.createElement('button'); b.className='mopt'+(m.lock?' lock':'')+(m.id===mid?' on':'');
    b.dataset.m=m.id; b.setAttribute('role','menuitem'); if(m.lock) b.setAttribute('aria-disabled','true');
    const info=document.createElement('div'), n=document.createElement('b'), s=document.createElement('span'), ic=document.createElement('div');
    n.textContent=m.name; if(m.isNew){ const nw=document.createElement('em'); nw.className='nw'; nw.textContent='NEW'; n.appendChild(nw); } s.textContent=m.d; info.append(n,s);
    ic.className='ic'; ic.textContent=m.lock?'🔒':(m.id===mid?'✓':'');
    b.append(info,ic); menu.appendChild(b);
  }
  if(showOld) for(const m of OLD){
    const b=document.createElement('button'); b.className='mopt lock'; b.setAttribute('role','menuitem'); b.setAttribute('aria-disabled','true'); b.tabIndex=-1;
    const info=document.createElement('div'), n=document.createElement('b'), s=document.createElement('span'), ic=document.createElement('div');
    n.textContent=m.name; const rt=document.createElement('em'); rt.className='nw'; rt.style.background='var(--line)'; rt.style.color='var(--dim)'; rt.textContent=m.tag||'OUTDATED'; n.appendChild(rt);
    s.textContent=m.d+' '+(m.note||'Outdated and no longer available.'); info.append(n,s); ic.className='ic'; ic.textContent='🔒'; b.append(info,ic); menu.appendChild(b);
  }
  const tg=document.createElement('button'); tg.type='button'; tg.className='mopt'; tg.id='oldtg'; tg.style.justifyContent='center'; tg.style.color='var(--dim)'; tg.style.fontSize='12px';
  tg.textContent=showOld?'Hide outdated models':'Show outdated models';
  tg.onclick=e=>{ e.stopPropagation(); showOld=!showOld; renderModels(); };
  menu.appendChild(tg);
}
function toggleMenu(open){ menu.classList.toggle('open',open); mbtn.setAttribute('aria-expanded',open); }
mbtn.onclick=e=>{ e.stopPropagation(); toggleMenu(!menu.classList.contains('open')); };
menu.onclick=e=>{ e.stopPropagation(); const b=e.target.closest('[data-m]'); if(!b) return;
  const m=MODELS.find(x=>x.id===b.dataset.m); if(!m||m.lock) return;
  mid=m.id; try{localStorage.setItem('neoxai-model',mid);}catch(e){} renderModels(); toggleMenu(false); inp.focus(); };
document.addEventListener('click',()=>toggleMenu(false));
addEventListener('keydown',e=>{ if(e.key==='Escape') toggleMenu(false); });
renderModels();

/* ---------- brain ---------- */
let dl=null,imgCaps=null,deepNext=false,ctl=null; sample=true;
fetch('/api/chat').then(r=>r.json()).then(i=>{ if(i&&i.vision){ imgCaps={maxCount:3,maxInputBytes:20e6}; $('pick').accept='image/*'; $('attach').hidden=false; } }).catch(()=>{});
async function ask(msgs,onText){
  const res=await fetch('/api/chat',{method:'POST',signal:ctl&&ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:mid,memory:memText(),deep:(()=>{ const d=deepNext; deepNext=false; return d; })()})});
  if(!res.ok){ let m='',j={}; try{ j=await res.json(); m=j.error||''; }catch(e){} const er=new Error(m||('Server '+res.status)); er.status=res.status; er.thinking=!!j.thinking; er.retry=j.retry||0; throw er; }
  try{ const sh=res.headers.get('X-Neo-Sources'); if(sh){ const si=JSON.parse(decodeURIComponent(sh)), sq=si.find(x=>x.search), pg=si.filter(x=>!x.search), ok=pg.filter(x=>x.ok).map(x=>x.host), bad=pg.filter(x=>!x.ok).map(x=>x.host);
    note.textContent=[sq?(sq.ok?'🔎 Searched the web: '+sq.search:'⚠ Web search failed'):'',ok.length?'🔗 Read '+ok.join(', '):'',bad.length?'⚠ Could not open '+bad.join(', '):''].filter(Boolean).join(' · '); setTimeout(()=>{ note.textContent='Johnny made this AI just for fun.'; },7000); } }catch(e){}

['Rh','Rhodium','102.91','Wollaston, 1803','A rare, silvery, very reflective platinum-group metal. It is mostly used in car catalytic converters to cut exhaust pollution, and as shiny plating on jewelry. It is one of the most expensive metals.'],
['Pd','Palladium','106.42','Wollaston, 1803','A platinum-group metal that can soak up large amounts of hydrogen. It is used in catalytic converters, electronics, dentistry and jewelry, and it is named after the asteroid Pallas.'],

['Cd','Cadmium','112.41','Stromeyer, 1817','A soft, bluish metal used in nickel-cadmium batteries and in pigments. It is toxic, so its use is now restricted.'],

['Sn','Tin','118.71','Known since antiquity','A soft, silvery metal that resists corrosion. Mixed with copper it makes bronze, and it is used in solder and to coat steel cans. Its symbol comes from the Latin stannum.'],

['Te','Tellurium','127.60','von Reichenstein, 1782','A brittle metalloid that is rare in Earth\'s crust. It is used in thin-film solar panels (cadmium telluride) and in alloys. It is named after Tellus, the Latin word for Earth.'],
['I','Iodine','126.90','Courtois, 1811','A shiny purple-black solid that gives off violet vapor. The thyroid gland needs iodine to make hormones, which is why it is added to table salt. It is also an antiseptic.'],
['Xe','Xenon','131.29','Ramsay and Travers, 1898','A heavy, colorless noble gas used in camera flashes, car headlights and spacecraft ion thrusters. It was one of the first noble gases shown to form compounds.'],
['Cs','Caesium','132.91','Bunsen and Kirchhoff, 1860','A soft, golden, extremely reactive metal that melts at about 28 °C. Atomic clocks define one second as 9,192,631,770 vibrations of a caesium atom.'],
['Ba','Barium','137.33','Davy, 1808','A soft, silvery metal that burns green. Barium sulfate is swallowed as a "barium meal" to show the gut on X-rays, while soluble barium compounds are poisonous.'],
['La','Lanthanum','138.91','Mosander, 1839','The first of the lanthanides, a soft, silvery metal. It is used in camera lenses, rechargeable nickel-metal-hydride batteries and in catalysts for refining oil.'],
['Ce','Cerium','140.12','Berzelius and Hisinger, 1803','The most abundant of the rare-earth metals. It is used in lighter flints, catalytic converters, glass polishing and self-cleaning ovens.'],
['Pr','Praseodymium','140.91','von Welsbach, 1885','A soft, silvery rare-earth metal whose compounds color glass and ceramics yellow-green. It is used in strong magnets, aircraft engine alloys and welding goggles.'],
['Nd','Neodymium','144.24','von Welsbach, 1885','A rare-earth metal used in the strongest permanent magnets, found in headphones, hard drives, wind turbines and electric motors. It also colors glass violet and is used in lasers.'],
['Pm','Promethium','(145)','Marinsky, Glendenin and Coryell, 1945','A radioactive rare earth with no stable isotopes, extremely rare in nature. It has been used in luminous paint and small nuclear batteries. It is named after Prometheus.'],
['Sm','Samarium','150.36','Lecoq de Boisbaudran, 1879','A silvery rare-earth metal used in samarium-cobalt magnets, which stay strong at high temperatures, and in some nuclear reactor control rods.'],
['Eu','Europium','151.96','Demarçay, 1901','A fairly soft, very reactive rare earth. Its compounds give the red and blue light in display phosphors, and they are used in security ink on euro banknotes. It is named after Europe.'],
['Gd','Gadolinium','157.25','de Marignac, 1880','A rare-earth metal that is strongly magnetic near room temperature. Gadolinium compounds are used as contrast agents in MRI scans, and the metal absorbs neutrons very well.'],
['Tb','Terbium','158.93','Mosander, 1843','A soft, silvery rare earth that gives off green light in phosphors for lighting and displays. It is also used in some sensors and sonar alloys.'],
['Dy','Dysprosium','162.50','Lecoq de Boisbaudran, 1886','A rare earth added to magnets so they keep their strength when hot, which matters for wind turbines and electric cars. Its name comes from a Greek word meaning "hard to get".'],
['Ho','Holmium','164.93','Delafontaine, Soret and Cleve, 1878-79','A rare earth with the strongest magnetic moment of any element. It is used in some medical lasers and in nuclear control rods, and it is named after Stockholm.'],
['Er','Erbium','167.26','Mosander, 1843','A rare earth that gives glass a pink color. Erbium-doped fibers amplify the light signals in long-distance internet cables, and it is also used in lasers.'],
['Tm','Thulium','168.93','Cleve, 1879','One of the rarest of the rare earths. It is used in some lasers and in a few portable X-ray devices.'],
['Yb','Ytterbium','173.05','de Marignac, 1878','A soft, silvery rare earth used in extremely precise atomic clocks, lasers and some steel alloys. It is named after Ytterby, Sweden.'],
['Lu','Lutetium','174.97','Urbain, 1907','The last, hardest and densest lanthanide. Its compounds are used in PET scanner detectors, and lutetium-177 is used in some cancer treatments.'],
['Hf','Hafnium','178.49','Coster and von Hevesy, 1923','A silvery metal that absorbs neutrons well, used in nuclear control rods and in the transistors of modern computer chips. It is named after Hafnia, the Latin name of Copenhagen.'],
['Ta','Tantalum','180.95','Ekeberg, 1802','A hard metal that is extremely resistant to corrosion. It is used for tiny capacitors in phones and laptops and for surgical implants. It is named after Tantalus from Greek myth.'],
['W','Tungsten','183.84','de Elhuyar brothers, 1783','It has the highest melting point of any metal, 3422 °C, so it is used in old light-bulb filaments, rocket nozzles and cutting tools. Its symbol W comes from the name wolfram.'],
['Re','Rhenium','186.21','Noddack, Tacke and Berg, 1925','One of the rarest and densest metals, with a very high melting point. It is used in jet engine alloys and catalysts, and it was the last stable element to be discovered.'],
['Os','Osmium','190.23','Tennant, 1803','The densest naturally occurring element, a hard, bluish metal. It is used in fountain-pen tips and electrical contacts. Its name comes from a Greek word for smell, because its oxide stinks.'],
['Ir','Iridium','192.22','Tennant, 1803','A very hard, corrosion-resistant metal and one of the densest elements. It is used in spark plugs and crucibles. A thin iridium-rich layer in rocks worldwide is linked to the asteroid that ended the dinosaurs.'],
['Pt','Platinum','195.08','Known in pre-Columbian South America; described in Europe in the 1700s','A dense, silvery precious metal that does not tarnish. It is used in jewelry, catalytic converters, lab equipment and some cancer drugs such as cisplatin.'],
['Au','Gold','196.97','Known since antiquity','A soft, yellow, dense metal that does not corrode. It is used for jewelry, coins and electronics and as a store of value. Its symbol comes from the Latin aurum.'],
['Hg','Mercury','200.59','Known since antiquity','The only metal that is liquid at room temperature. It was used in thermometers, barometers and lamps, but it is toxic, so it is being phased out. Its symbol comes from the Latin hydrargyrum.'],
['Tl','Thallium','204.38','Crookes, 1861','A soft, heavy metal whose compounds are highly poisonous, once used in rat poison. Today it appears in some electronics and medical imaging. Its name comes from a green line in its spectrum.'],
['Pb','Lead','207.2','Known since antiquity','A soft, dense, toxic metal. It is used in car batteries and in radiation shielding, and it used to be common in pipes, paint and fuel. Its symbol comes from the Latin plumbum.'],
['Bi','Bismuth','208.98','Known since antiquity; recognized as an element by Geoffroy, 1753','A brittle, pinkish metal that is so weakly radioactive it is treated as practically stable. It is used in stomach medicines and in low-melting alloys, and it grows iridescent, stair-step crystals.'],
['Po','Polonium','(209)','Marie and Pierre Curie, 1898','An extremely radioactive, rare element found in tiny amounts in uranium ores. It is named after Poland, Marie Curie\'s homeland, and it is used in static eliminators and as a heat source in some spacecraft.'],
['At','Astatine','(210)','Corson, MacKenzie and Segrè, 1940','The rarest naturally occurring element, intensely radioactive, with only short-lived isotopes. Astatine-211 is being studied for targeted cancer therapy.'],
['Rn','Radon','(222)','Dorn, 1900','A radioactive, colorless noble gas that seeps out of uranium-bearing rocks and can collect in buildings. It is a leading cause of lung cancer after smoking, so homes are tested for it.'],
['Fr','Francium','(223)','Perey, 1939','An extremely radioactive alkali metal. Its longest-lived isotope lasts only about 22 minutes, and only tiny amounts exist in nature. It is named after France.'],
['Ra','Radium','(226)','Marie and Pierre Curie, 1898','A radioactive alkaline earth metal that glows faintly. It was once used in glow-in-the-dark paint, which harmed the workers who made it. Today it is used only rarely in medicine.'],
['Ac','Actinium','(227)','Debierne, 1899','A radioactive metal that glows blue in the dark. It gives the actinide series its name and is used in research and in some cancer therapies.'],
['Th','Thorium','232.04','Berzelius, 1828','A weakly radioactive metal, more common than tin. It is studied as a possible nuclear fuel and was used in gas lantern mantles. It is named after Thor, the Norse god.'],
['Pa','Protactinium','231.04','Hahn and Meitner, 1917','A rare, dense, radioactive metal found in uranium ores. It is mostly of interest to researchers, for example for dating ocean sediments.'],
['U','Uranium','238.03','Klaproth, 1789','A dense, radioactive metal that is the main fuel in nuclear power plants. Its isotope uranium-235 can undergo fission. It is named after the planet Uranus.'],
['Np','Neptunium','(237)','McMillan and Abelson, 1940','The first element heavier than uranium to be made. It is a radioactive by-product of nuclear reactors and is named after the planet Neptune.'],
['Pu','Plutonium','(244)','Seaborg and colleagues, 1940','A dense radioactive metal made in nuclear reactors. It is used in nuclear weapons, as reactor fuel and as the power source of some space probes. It is named after Pluto.'],
['Am','Americium','(243)','Seaborg and colleagues, 1944','A radioactive metal made in reactors. Americium-241 sits inside most household smoke detectors. It is named after the Americas.'],
['Cm','Curium','(247)','Seaborg and colleagues, 1944','A radioactive, silvery metal made in reactors. It has been used as a power source in spacecraft and in the X-ray instruments of Mars rovers. It is named after Marie and Pierre Curie.'],
['Bk','Berkelium','(247)','Berkeley laboratory, 1949','A synthetic radioactive metal first made at Berkeley, California. It is used only in research, for example as a target to make heavier elements such as tennessine.'],
['Cf','Californium','(251)','Berkeley laboratory, 1950','A synthetic radioactive element. Californium-252 is a strong neutron source used to start nuclear reactors, to search for gold and oil and to scan luggage.'],
['Es','Einsteinium','(252)','Found in 1952 in the debris of the first hydrogen bomb test','A synthetic radioactive element, made only in tiny amounts for research. It is named after Albert Einstein.'],
['Fm','Fermium','(257)','Found in 1952 in the debris of the first hydrogen bomb test','A synthetic radioactive element named after Enrico Fermi. It is one of the heaviest elements that can be made by bombarding lighter ones with neutrons.'],
['Md','Mendelevium','(258)','Ghiorso and colleagues, 1955','A synthetic radioactive element first made a few atoms at a time. It is named after Dmitri Mendeleev, who created the periodic table.'],
['No','Nobelium','(259)','1950s-60s (credit was disputed)','A synthetic radioactive element made only a few atoms at a time for research. It is named after Alfred Nobel.'],
['Lr','Lawrencium','(266)','Ghiorso and colleagues, 1961','A synthetic radioactive element at the end of the actinide series. It is named after Ernest Lawrence, who invented the cyclotron, and only a few atoms are made at a time.'],
['Rf','Rutherfordium','(267)','Dubna and Berkeley teams, 1960s','A synthetic, highly radioactive element, the first one heavier than the actinides. It is named after Ernest Rutherford and is made a few atoms at a time.'],
['Db','Dubnium','(268)','Dubna (1968) and Berkeley (1970)','A synthetic radioactive element named after Dubna, the Russian research town where it was made. Its isotopes are short-lived.'],
['Sg','Seaborgium','(269)','Ghiorso and colleagues, Berkeley, 1974','A synthetic radioactive element named after Glenn Seaborg, the first element to be named after a person who was still alive.'],
['Bh','Bohrium','(270)','GSI Darmstadt, Germany, 1981','A synthetic radioactive element named after Niels Bohr. It was made by smashing chromium atoms into bismuth.'],
['Hs','Hassium','(277)','GSI Darmstadt, Germany, 1984','A synthetic radioactive element named after Hesse, the German state of Darmstadt. Experiments show it behaves like a heavy version of osmium.'],
['Mt','Meitnerium','(278)','GSI Darmstadt, Germany, 1982','A synthetic radioactive element named after Lise Meitner, who helped explain nuclear fission. Only a few atoms have ever been made.'],
['Ds','Darmstadtium','(281)','GSI Darmstadt, Germany, 1994','A synthetic, extremely short-lived element named after the German city of Darmstadt, where it was first made.'],
['Rg','Roentgenium','(282)','GSI Darmstadt, Germany, 1994','A synthetic radioactive element named after Wilhelm Röntgen, who discovered X-rays. Only a few atoms have been made.'],
['Cn','Copernicium','(285)','GSI Darmstadt, Germany, 1996','A synthetic radioactive element named after Nicolaus Copernicus. It is predicted to be a very volatile metal, related to mercury.'],
['Nh','Nihonium','(286)','RIKEN, Japan, 2004','A synthetic radioactive element named after Nihon, a Japanese name for Japan. It was the first element discovered in an Asian country.'],
['Fl','Flerovium','(289)','Dubna, Russia, 1998','A synthetic radioactive element named after the Flerov Laboratory in Dubna. It lies close to the predicted "island of stability" of longer-lived heavy nuclei.'],
['Mc','Moscovium','(290)','Dubna, Russia, 2003','A synthetic radioactive element named after the Moscow region, where Dubna lies. Only a few hundred atoms have ever been made, and they last a fraction of a second.'],
['Lv','Livermorium','(293)','Dubna, Russia, 2000','A synthetic radioactive element named after the Lawrence Livermore National Laboratory in California. It is extremely short-lived.'],
['Ts','Tennessine','(294)','Dubna, Oak Ridge and Livermore teams, 2010','A synthetic radioactive element named after Tennessee, home of Oak Ridge National Laboratory. It was made by hitting berkelium with calcium ions.'],
['Og','Oganesson','(294)','Dubna and Livermore teams, 2002-2006','The heaviest element known, synthetic and radioactive. It sits in the noble gas column but is predicted to behave very differently. It is named after the physicist Yuri Oganessian.']
];

const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const CATS={alkali:['Alkali metal','#ef4444'],alkaline:['Alkaline earth metal','#f59e0b'],tm:['Transition metal','#3b82f6'],post:['Post-transition metal','#14b8a6'],metalloid:['Metalloid','#84cc16'],nonmetal:['Reactive nonmetal','#22c55e'],halogen:['Halogen','#06b6d4'],noble:['Noble gas','#a855f7'],lan:['Lanthanide','#ec4899'],act:['Actinide','#f97316'],unk:['Unknown properties','#94a3b8']};
const CAT=[];const put=(k,a)=>a.forEach(z=>CAT[z]=k);
put('nonmetal',[1,6,7,8,15,16,34]);put('noble',[2,10,18,36,54,86]);put('halogen',[9,17,35,53,85]);put('metalloid',[5,14,32,33,51,52]);
put('alkali',[3,11,19,37,55,87]);put('alkaline',[4,12,20,38,56,88]);put('post',[13,31,49,50,81,82,83,84]);
for(let z=57;z<=71;z++)CAT[z]='lan';for(let z=89;z<=103;z++)CAT[z]='act';
for(let z=21;z<=30;z++)CAT[z]='tm';for(let z=39;z<=48;z++)CAT[z]='tm';for(let z=72;z<=80;z++)CAT[z]='tm';for(let z=104;z<=108;z++)CAT[z]='tm';
for(let z=109;z<=118;z++)CAT[z]='unk';
const ALT={13:'aluminum',55:'cesium',16:'sulphur'};
function pos(z){
  if(z===1)return[1,1];if(z===2)return[1,18];
  if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];
  if(z<=12)return[3,z-10];if(z<=18)return[3,z];
  if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];
  if(z<=56)return[6,z-54];if(z<=71)return[9,z-54];
  if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];
  if(z<=103)return[10,z-86];return[7,z-100];
}
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).replace(/\d/g,d=>SUP[d]);
const ORD=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]];
const NOB=[[2,'He',1],[10,'Ne',3],[18,'Ar',5],[36,'Kr',8],[54,'Xe',11],[86,'Rn',15]];
const EX={24:['Ar','4s1 3d5'],29:['Ar','4s1 3d10'],41:['Kr','5s1 4d4'],42:['Kr','5s1 4d5'],44:['Kr','5s1 4d7'],45:['Kr','5s1 4d8'],46:['Kr','4d10'],47:['Kr','5s1 4d10'],57:['Xe','6s2 5d1'],58:['Xe','6s2 4f1 5d1'],64:['Xe','6s2 4f7 5d1'],78:['Xe','6s1 4f14 5d9'],79:['Xe','6s1 4f14 5d10'],89:['Rn','7s2 6d1'],90:['Rn','7s2 6d2'],91:['Rn','7s2 5f2 6d1'],92:['Rn','7s2 5f3 6d1'],93:['Rn','7s2 5f4 6d1'],96:['Rn','7s2 5f7 6d1'],103:['Rn','7s2 5f14 7p1'],111:['Rn','7s1 5f14 6d10']};
function cfg(z){
  let core=null;for(const n of NOB)if(n[0]<z)core=n;let txt;
  if(EX[z])txt='['+EX[z][0]+'] '+EX[z][1];
  else{let left=z;const parts=[];for(let i=0;i<ORD.length&&left>0;i++){const c=Math.min(ORD[i][1],left);left-=c;parts.push(ORD[i][0]+c);}
    txt=(core?'['+core[1]+'] ':'')+parts.slice(core?core[2]:0).join(' ');}
  return txt.replace(/([spdf])(\d+)/g,(m,l,n)=>l+sup(n));
}
const GAS=[1,2,7,8,9,10,17,18,36,54,86],LIQ=[35,80];
const stateOf=z=>GAS.includes(z)?'Gas':LIQ.includes(z)?'Liquid':(z===85||z===87)?'Probably solid':z>=104?'Unknown':'Solid';
const D=EL.map((r,i)=>{const z=i+1,p=pos(z),row=p[0],col=p[1];
  const f=(z>=57&&z<=70)||(z>=89&&z<=102);
  const group=row>=9?((z===71||z===103)?3:null):col;
  const period=row<=7?row:(row===9?6:7);
  const block=f?'f':(z===2||group<=2)?'s':group>=13?'p':'d';
  return {z,sym:r[0],name:r[1],mass:r[2],disc:r[3],text:r[4],row,col,cat:CAT[z],state:stateOf(z),group,period,block,cfg:cfg(z)+(z>=104?' (predicted)':'')};});
const d=E('dialog','nxd nxp');d.id='nxpt';
d.innerHTML='<div class="ph"><h3>Periodic table</h3><input class="nxi2" id="ptq" placeholder="Find an element…" autocomplete="off" aria-label="Find an element"><button class="btn still" id="ptx" autofocus aria-label="Close">✕</button></div><div class="pt-detail" id="ptd"></div><div class="nxs pt-leg" id="ptl"></div><div class="pt-scroll"><div class="pt-grid" id="ptg"></div></div><p class="pt-tip">Click an element to read about it. Use ← and → to move through the table, and click a color to filter by family.</p>';
document.body.appendChild(d);
d.addEventListener('click',e=>{if(e.target===d)d.close()});
const q=d.querySelector('#ptq'),det=d.querySelector('#ptd'),leg=d.querySelector('#ptl'),grid=d.querySelector('#ptg');
d.querySelector('#ptx').onclick=()=>d.close();
let sel=0,catF='';const cells=[];
D.forEach((e,i)=>{const b=E('button','pt-el');b.type='button';b.style.gridRow=e.row;b.style.gridColumn=e.col;b.style.setProperty('--c',CATS[e.cat][1]);
  b.title=e.name;b.setAttribute('aria-label',e.name+', atomic number '+e.z);
  b.append(E('i','',e.z),E('b','',e.sym),E('em','',e.name));b.onclick=()=>show(i);grid.appendChild(b);cells.push(b)});
[[6,'lan','57–71'],[7,'act','89–103']].forEach(a=>{const b=E('div','pt-el pt-ph');b.style.gridRow=a[0];b.style.gridColumn=3;b.style.setProperty('--c',CATS[a[1]][1]);b.append(E('i','',''),E('b','',a[2]),E('em','',a[1]==='lan'?'Lanthanides':'Actinides'));grid.appendChild(b)});
const gap=E('div','pt-gap');grid.appendChild(gap);
Object.keys(CATS).forEach(k=>{const c=E('button','chip');c.type='button';const dot=E('span','pt-dot');dot.style.background=CATS[k][1];c.append(dot,document.createTextNode(CATS[k][0]));
  c.onclick=()=>{catF=catF===k?'':k;leg.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c&&!!catF));filter()};leg.appendChild(c)});
function massText(m){return m[0]==='('?m.slice(1,-1)+' (most stable isotope)':m}
function show(i){sel=((i%118)+118)%118;const e=D[sel],col=CATS[e.cat][1];
  cells.forEach((c,k)=>c.classList.toggle('sel',k===sel));
  const prop=(l,v,w)=>'<div'+(w?' class="wide"':'')+'><span>'+l+'</span>'+v+'</div>';
  det.innerHTML='<div class="pt-tile" style="--c:'+col+'"><small>'+e.z+'</small><b>'+e.sym+'</b><span>'+e.name+'</span><small>'+massText(e.mass).split(' ')[0]+'</small></div>'+
   '<div class="pt-info"><h4>'+e.name+'</h4><p>'+e.text+'</p><div class="pt-props">'+
   prop('Category',CATS[e.cat][0])+prop('Atomic number',e.z)+prop('Atomic mass',massText(e.mass))+prop('Group',e.group||'f-block series')+prop('Period',e.period)+prop('Block',e.block)+prop('State at room temperature',e.state)+prop('Electron configuration',e.cfg,1)+prop('Discovered',e.disc,1)+
   '</div><div class="ctabs"><button class="btn still" data-a="p">← Previous</button><button class="btn still" data-a="n">Next →</button><button class="btn still" data-a="ask">Ask AI about '+e.name+'</button><button class="btn still" data-a="quiz">Quiz me</button></div></div>';
  det.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='p')show(sel-1);else if(a==='n')show(sel+1);
    else{d.close();send(a==='ask'?'Explain the element '+e.name+' ('+e.sym+', atomic number '+e.z+') in detail: its atoms, properties, where it is found, what it is used for, and one surprising fact.':'Give me a 5-question quiz about the periodic table and chemical elements.');}});
}
function filter(){const s=q.value.trim().toLowerCase();
  cells.forEach((c,i)=>{const e=D[i];const hay=(e.sym+' '+e.name+' '+e.z+' '+CATS[e.cat][0]+' '+(ALT[e.z]||'')).toLowerCase();
    const okq=!s||hay.includes(s),okc=!catF||e.cat===catF;c.classList.toggle('dim',!(okq&&okc))});}
q.oninput=filter;
q.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();const s=q.value.trim().toLowerCase();
  let i=D.findIndex(e=>e.sym.toLowerCase()===s||e.name.toLowerCase()===s||String(e.z)===s||(ALT[e.z]||'')===s);
  if(i<0)i=cells.findIndex(c=>!c.classList.contains('dim'));if(i>=0)show(i);}};
d.addEventListener('keydown',ev=>{if(ev.target===q)return;if(ev.key==='ArrowRight'){ev.preventDefault();show(sel+1)}else if(ev.key==='ArrowLeft'){ev.preventDefault();show(sel-1)}});
show(0);
window.nxOpenPeriodic=function(s){
  s=String(s||'').trim().toLowerCase();
  if(s){const i=D.findIndex(e=>e.sym.toLowerCase()===s||e.name.toLowerCase()===s||String(e.z)===s||(ALT[e.z]||'')===s);if(i>=0)show(i);}
  q.value='';catF='';leg.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));filter();
  if(!d.open)d.showModal();
};
})();
